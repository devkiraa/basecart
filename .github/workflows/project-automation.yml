name: GitHub Projects v2 Automation

on:
  issues:
    types: [opened, labeled, reopened]
  pull_request:
    types: [opened, labeled, synchronize]

permissions:
  issues: write
  pull-requests: write
  repository-projects: write

jobs:
  track-project:
    name: Auto-Track on GitHub Projects Board
    runs-on: ubuntu-latest
    steps:
      - name: Add to Project Board
        uses: actions/add-to-project@v0.5.0
        with:
          project-url: 'https://github.com/users/devkiraa/projects/1'
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}
