  { name = "TENANT_DO", class_name = "TenantDO" }
]

[[env.staging.r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "basecart-media-staging"

[[env.staging.kv_namespaces]]
binding = "KV_STORE"
