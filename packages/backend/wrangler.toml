MARKETING_URL = "https://staging.basecart.app"
MERCHANT_DASHBOARD_URL = "https://merchant-staging.basecart.app"

# ZeptoMail configurations for staging environment
ZEPTOMAIL_API_URL = "https://api.zeptomail.in/v1.1/email"
MAIL_FROM_ADDRESS = "noreply@basecart.app"
