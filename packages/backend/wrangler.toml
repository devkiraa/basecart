name = "basecart-backend"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = [ "nodejs_compat" ]

[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = true

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TenantDO"]


# --- DEVELOPMENT ENVIRONMENT (wrangler deploy --env dev) ---
[env.dev]
name = "basecart-backend-dev"

[env.dev.vars]
NODE_ENV = "development"
API_URL = "http://localhost:3001"
ALLOWED_ORIGINS = "http://localhost:3000,http://localhost:3002,http://localhost:3004,https://basecart.app,https://admin.basecart.app,https://*.basecart.app"
COOKIE_DOMAIN_MERCHANT = "localhost"
COOKIE_DOMAIN_CUSTOMER = "localhost"
COOKIE_DOMAIN_ADMIN = "localhost"
CLOUDFLARE_ZONE_URL = "http://localhost:3001"
S3_BUCKET = "basecart-media-dev"
MARKETING_URL = "http://localhost:3000"
MERCHANT_DASHBOARD_URL = "http://localhost:3004"

# ZeptoMail configurations for dev environment
ZEPTOMAIL_API_URL = "https://api.zeptomail.in/v1.1/email"
MAIL_FROM_ADDRESS = "noreply@basecart.app"
MAIL_FROM_NAME = "Basecart"
# Note: ZEPTOMAIL_TOKEN must be set as a Cloudflare secret via CLI or dashboard.

[[env.dev.d1_databases]]
binding = "CONTROL_DB"
database_name = "basecart-control-dev"
database_id = "bd31b769-7c65-4308-b078-91de57b94687"

[env.dev.durable_objects]
bindings = [
  { name = "TENANT_DO", class_name = "TenantDO" }
]

[[env.dev.r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "basecart-media-dev"

[[env.dev.kv_namespaces]]
binding = "KV_STORE"
id = "5bad528ae4ec4f4d932293f00895a7fe"

[[env.dev.queues.producers]]
binding = "JOBS_QUEUE"
queue = "basecart-jobs-queue-dev"

[[env.dev.queues.consumers]]
queue = "basecart-jobs-queue-dev"
max_batch_size = 10
max_batch_timeout = 5

[[env.dev.ratelimits]]
name = "API_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 100, period = 60 }


# --- STAGING ENVIRONMENT (wrangler deploy --env staging) ---
[env.staging]
name = "basecart-backend-staging"

[env.staging.vars]
