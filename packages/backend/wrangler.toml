name = "basecart-backend"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = [ "nodejs_compat" ]

[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = true

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TenantDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["TenantDOProd"]

[[ratelimits]]
name = "API_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 100, period = 60 }

[vars]
NODE_ENV = "production"
API_URL = "https://api.basecart.app"
ALLOWED_ORIGINS = "https://basecart.app,https://merchant.basecart.app,https://admin.basecart.app,https://*.basecart.app"
COOKIE_DOMAIN_MERCHANT = ".basecart.app"
COOKIE_DOMAIN_CUSTOMER = ".basecart.app"
COOKIE_DOMAIN_ADMIN = ".basecart.app"
CLOUDFLARE_ZONE_URL = "https://api.basecart.app"
S3_BUCKET = "basecart-media-prod"
MARKETING_URL = "https://basecart.app"
MERCHANT_DASHBOARD_URL = "https://merchant.basecart.app"

# Razorpay credentials (overridden by .dev.vars in local dev, set as Wrangler secrets in production)
RAZORPAY_KEY_ID = ""
RAZORPAY_KEY_SECRET = ""

# ZeptoMail configurations for production environment
ZEPTOMAIL_API_URL = "https://api.zeptomail.in/v1.1/email"
MAIL_FROM_ADDRESS = "noreply@basecart.app"
MAIL_FROM_NAME = "Basecart"

[[d1_databases]]
binding = "CONTROL_DB"
database_name = "basecart-control-prod"
database_id = "5a1c680b-b6d4-4b6d-8283-8bfc8905d227"

[durable_objects]
bindings = [
  { name = "TENANT_DO", class_name = "TenantDOProd" }
]

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "basecart-media-prod"

[[kv_namespaces]]
binding = "KV_STORE"
id = "782dd48172da4b1399b361107b48c2bd"

[[queues.producers]]
binding = "JOBS_QUEUE"
queue = "basecart-jobs-queue-prod"

[[queues.consumers]]
queue = "basecart-jobs-queue-prod"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3


