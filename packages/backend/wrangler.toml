name = "basecart-backend"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = [ "nodejs_compat" ]

[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = true

[[ratelimits]]
name = "API_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 100, period = 60 }

[vars]
API_URL = "https://basecart-backend.devkiraa.workers.dev"
NODE_ENV = "staging"
ALLOWED_ORIGINS = "https://basecart.pages.dev,https://*.basecart.pages.dev,https://basecart-admin-panel.pages.dev,https://*.basecart-admin-panel.pages.dev,https://basecart-storefront.pages.dev,https://*.basecart-storefront.pages.dev"
COOKIE_DOMAIN_MERCHANT = "basecart.pages.dev"
COOKIE_DOMAIN_CUSTOMER = ".basecart-storefront.pages.dev"
COOKIE_DOMAIN_ADMIN = "basecart-admin-panel.pages.dev"
CLOUDFLARE_ZONE_URL = "https://basecart-backend.devkiraa.workers.dev"
S3_BUCKET = "basecart-media-bucket"

[[d1_databases]]
binding = "CONTROL_DB"
database_name = "basecart-control-staging"
database_id = "94242e41-5fc6-43e2-9abf-ff7b45436522"

[durable_objects]
bindings = [
  { name = "TENANT_DO", class_name = "TenantDO" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TenantDO"]

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "basecart-media-bucket"

[[queues.producers]]
binding = "JOBS_QUEUE"
queue = "basecart-jobs-queue-staging"

[[queues.consumers]]
queue = "basecart-jobs-queue-staging"
max_batch_size = 10
max_batch_timeout = 5

# Production Environment Settings
[env.production]
name = "basecart-backend-prod"

[env.production.vars]
NODE_ENV = "production"
API_URL = "https://api.basecart.app"
ALLOWED_ORIGINS = "https://dashboard.basecart.app,https://admin.basecart.app,https://*.basecart.store"
COOKIE_DOMAIN_MERCHANT = ".basecart.app"
COOKIE_DOMAIN_CUSTOMER = ".basecart.store"
COOKIE_DOMAIN_ADMIN = ".basecart.app"
CLOUDFLARE_ZONE_URL = "https://api.basecart.app"
S3_BUCKET = "basecart-media-prod"

[[env.production.d1_databases]]
binding = "CONTROL_DB"
database_name = "basecart-control-prod"
database_id = "PROD_D1_CONTROL_DB_ID" # REPLACE with real production D1 database ID

[env.production.durable_objects]
bindings = [
  { name = "TENANT_DO", class_name = "TenantDO" }
]

[[env.production.r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "basecart-media-prod"

[[env.production.queues.producers]]
binding = "JOBS_QUEUE"
queue = "basecart-jobs-queue-prod"

[[env.production.queues.consumers]]
queue = "basecart-jobs-queue-prod"
max_batch_size = 10
max_batch_timeout = 5

# Staging Environment Settings
[env.staging]
name = "basecart-backend-staging"

[env.staging.vars]
NODE_ENV = "staging"
API_URL = "https://api-staging.basecart.app"
ALLOWED_ORIGINS = "https://dashboard-staging.basecart.app,https://admin-staging.basecart.app,https://*.staging.basecart.store"
COOKIE_DOMAIN_MERCHANT = ".basecart.app"
COOKIE_DOMAIN_CUSTOMER = ".staging.basecart.store"
COOKIE_DOMAIN_ADMIN = ".basecart.app"
CLOUDFLARE_ZONE_URL = "https://api-staging.basecart.app"
S3_BUCKET = "basecart-media-bucket"

[[env.staging.d1_databases]]
binding = "CONTROL_DB"
database_name = "basecart-control-staging"
database_id = "94242e41-5fc6-43e2-9abf-ff7b45436522"

[env.staging.durable_objects]
bindings = [
  { name = "TENANT_DO", class_name = "TenantDO" }
]

[[env.staging.r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "basecart-media-bucket"

[[env.staging.queues.producers]]
binding = "JOBS_QUEUE"
queue = "basecart-jobs-queue-staging"

[[env.staging.queues.consumers]]
queue = "basecart-jobs-queue-staging"
max_batch_size = 10
max_batch_timeout = 5

[[env.staging.ratelimits]]
name = "API_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 100, period = 60 }

