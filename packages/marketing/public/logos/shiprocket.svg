<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="srGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FF4500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E84D1C;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="srAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8C00;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background rounded rect -->
  <rect x="10" y="10" width="180" height="180" rx="24" fill="url(#srGradient)" />
  <!-- Shiprocket icon - rocket ship -->
  <g transform="translate(100, 100)">
    <!-- Rocket body -->
    <path d="M-18 35 L-18 5 L-8 -25 L2 -25 L12 5 L12 35 Z" fill="white" opacity="0.95"/>
    <!-- Rocket window -->
    <circle cx="-3" cy="10" r="5" fill="#FF6B35" />
    <!-- Rocket fins -->
    <path d="M-18 35 L-28 55 L-12 35 Z" fill="white" opacity="0.8"/>
    <path d="M12 35 L22 55 L6 35 Z" fill="white" opacity="0.8"/>
    <!-- Rocket flame -->
    <path d="M-8 35 L0 55 L8 35 Z" fill="url(#srAccent)" />
    <path d="M-5 35 L0 48 L5 35 Z" fill="#FFF8E1" opacity="0.9"/>
  </g>
  <!-- Shiprocket text -->
  <text x="100" y="170" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="white" text-anchor="middle" opacity="0.95">SHIPROCKET</text>
</svg>